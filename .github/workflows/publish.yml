name: Publish Extension

on:
  push:
    tags:
      - 'v*' # Trigger workflow on version tags like v1.0.0, v1.1.2

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    environment: marketplace # Required for requesting a GitHub token
    permissions:
      contents: write # Required for creating GitHub Releases
      id-token: write # Required for requesting a GitHub token
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Publisher Tools
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        run: vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get identity details
        run: |
          echo "=== Fetching Identity Details ==="
          IDENTITY=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 2>&1) || true
          echo "Identity output:"
          echo "$IDENTITY"

      - name: Publish with Azure Credential
        run: vsce publish -i *.vsix --skip-duplicate --azure-credential

